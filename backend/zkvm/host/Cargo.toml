[package]
name = "huma-replay"
version = "0.1.0"
edition = "2021"

[dependencies]
huma-replay-core = { path = "../common" }
huma-replay-methods = { path = "../methods" }
risc0-zkvm = { version = "=3.0.6", default-features = false, features = ["client", "disable-dev-mode"] }
serde_json = "=1.0.145"
serde = { version = "=1.0.228", features = ["derive"] }


huma-replay-verifier = { path = "../verifier" }
