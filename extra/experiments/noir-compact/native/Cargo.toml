[package]
name = "huma-compact-experiment"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
ark-bn254 = "=0.5.0"
ark-ff = "=0.5.0"
taceo-poseidon2 = { version = "=0.2.1", default-features = false, features = ["bn254", "t4"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.8"
p256 = { version = "=0.13.2", features = ["ecdsa"] }
rand_core = { version = "=0.6.4", features = ["getrandom"] }
hex = "=0.4.3"
base64 = "=0.22.1"
huma-replay-core = { path = "../../../../backend/zkvm/common" }

# Browsers: the page supplies randomness (web.rs).
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "=0.2.17", features = ["custom"] }

[workspace]
